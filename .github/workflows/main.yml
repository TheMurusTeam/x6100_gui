name: Build image
on:
  workflow_dispatch:
  push:
    # Pattern matched against refs/tags
    tags:
      - '**'           # Push events to every tag

jobs:
  build:
    runs-on: ubuntu-22.04
    # 1KO125: needed to create the release
    permissions:
      contents: write
    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false

        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: true
    - name: check free space
      run: |
        df -h
        pwd
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout GUI
      uses: actions/checkout@v4
      with:
        submodules: true
        path: x6100_gui

    - name: Checkout buildroot
      uses: actions/checkout@v4
      with:
        submodules: true
        repository: OpenX6100/AetherX6100Buildroot
        # 1KO125: the Buildroot commit the 1KO125 SD cards are built with
        ref: 273083c94bbfd23325b6cbd2c296746202caf533
        path: AetherX6100Buildroot

    - name: Patch GUI mk
      run: |
        sed -i "s,https://github.com/OpenX6100/x6100_gui,${GITHUB_WORKSPACE}/x6100_gui,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        sed -i "s,^X6100_GUI_SITE_METHOD = git,X6100_GUI_SITE_METHOD = local,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        sed -i "s,^X6100_GUI_GIT_SUBMODULES,# X6100_GUI_GIT_SUBMODULES,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk

    # 1KO125: Buildroot package patches (SSTV page of the web server)
    - name: Add 1KO125 package patches
      run: |
        cp -rv x6100_gui/buildroot/patches/. AetherX6100Buildroot/br2_external/package/

    # Ccache
    - name: Ccache cache files
      uses: actions/cache@v4
      with:
        path: ~/.buildroot-ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          Linux-ccache-${{ github.sha }}
          Linux-ccache-
          ${{ runner.os }}-ccache-

    # Configure
    - name: Configure
      run: |
        cd AetherX6100Buildroot && bash ./br_config.sh

    # 1KO125: U-Boot's source from its official GitHub mirror when
    # ftp.denx.de, its only download site in Buildroot, is down (19 Nov 2026:
    # the 1.2 build stopped there after an hour; sources.buildroot.net has no
    # 2023.01). Put in Buildroot's download folder, it is used as it is (a
    # custom U-Boot version: no hash to check). The SD card gets R1CBU's
    # U-Boot binary anyway (Replace u-boot below).
    - name: U-Boot source
      run: |
        f=AetherX6100Buildroot/buildroot/dl/uboot/u-boot-2023.01.tar.bz2
        mkdir -p "$(dirname "$f")"
        if ! curl -fsSL --connect-timeout 20 -m 300 -o "$f" https://ftp.denx.de/pub/u-boot/u-boot-2023.01.tar.bz2; then
          echo "::warning::ftp.denx.de unreachable: U-Boot v2023.01 from github.com/u-boot/u-boot"
          rm -f "$f"
          curl -fsSL -m 300 https://github.com/u-boot/u-boot/archive/refs/tags/v2023.01.tar.gz | gzip -d | bzip2 -9 > "$f"
        fi
        ls -l "$f"
        tar -tjf "$f" | head -3

    # Build
    - name: Build
      run: |
        cd AetherX6100Buildroot/build
        make lame
        make mpg123
        make libsndfile-dirclean
        make

    # Replace U-boot
    - name: Replace u-boot
      run: |
        dd if=x6100_gui/u-boot/u-boot-sunxi-with-spl.bin of=AetherX6100Buildroot/build/images/sdcard.img seek=8K bs=1 conv=notrunc

    # Compress image
    - name: Compress image
      run: |
        cd AetherX6100Buildroot/build/images
        mv sdcard.img sdcard-1KO125-${{ github.ref_name }}.img
        zip sdcard-1KO125-${{ github.ref_name }}.img.zip sdcard-1KO125-${{ github.ref_name }}.img

    # 1KO125: a run started by hand keeps the image in the run page (Artifacts)
    - name: Upload image
      uses: actions/upload-artifact@v4
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      with:
        name: sdcard-1KO125-${{ github.ref_name }}
        path: AetherX6100Buildroot/build/images/sdcard-1KO125-${{ github.ref_name }}.img.zip
        retention-days: 14

    # Create release
    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: AetherX6100Buildroot/build/images/sdcard-1KO125-${{ github.ref_name }}.img.zip
        prerelease: ${{ contains(github.ref_name, 'beta') }}
